name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Build frontend
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build archive
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/repo-server ./cmd/repo
          tar -C dist -czf dist/repo-linux-amd64.tar.gz repo-server
          rm dist/repo-server
          sha256sum dist/repo-linux-amd64.tar.gz > dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/repo-linux-amd64.tar.gz
            dist/checksums.txt
