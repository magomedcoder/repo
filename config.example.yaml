http:
  addr: "127.0.0.1:8080"
  cookie_secure: true
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
  receive_max_bytes: 268435456

server:
  data_dir: "data"
  site_name: "Repo"
  public_url: "" 
  soft_deleted_retention: 168h

secrets:
  session_secret: ""
  token_pepper: ""
  csrf_secret: ""
  mirror_secrets_key: ""

auth:
  allow_registration: false
  allow_public_contribute: false
  require_auth_for_read: false
  git_password_auth: true
  session_absolute: 720h
  session_idle: 336h

mirror:
  pull_interval: 5m
  workers: 4
  clone_timeout: 15m
  fetch_timeout: 10m
  push_timeout: 10m
  default_max_bytes: 5368709120
  # verify:
  #   openpgp_keyring: "trust/openpgp.asc"
  #   allowed_signers: "trust/allowed_signers"
